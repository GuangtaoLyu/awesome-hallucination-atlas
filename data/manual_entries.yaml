# Manual curation entries for the hallucination research library.
#
# This is the human-edited source of truth for papers that are NOT auto-fetched
# from arXiv (e.g. recovered papers, venue-only entries, or anything a curator
# wants to pin). `scripts/generate.py` loads this file and merges it with
# `scripts/raw_data.py` (legacy bulk list) and `data/incremental.json`
# (auto-harvested arXiv candidates).
#
# Schema (one entry per `-` block; all fields are plain scalars):
#   title:   REQUIRED  (exact paper title; used as the dedup key)
#   authors: OPTIONAL (free text, e.g. "Zheng et al." or full names)
#   url:     OPTIONAL  (arXiv abs link, DOI, or publisher page)
#   year:    OPTIONAL  (defaults to 2026)
#   venue:   OPTIONAL  (venue override; if present it wins over auto-derivation)
#
# To add a paper, append a new `-` block. Keep titles exact to avoid duplicates.

