name: Deploy to GitHub Pages

# Publish the committed docs/ site to a gh-pages branch.
# NOTE: We deliberately avoid `actions/deploy-pages@v4` here. Under the forced
# Node.js 24 runner runtime that action misbehaves — it keeps re-targeting a
# stale `deployment_queued` deployment, polls it forever, then times out and
# aborts (see failed runs on 2026-08-06). Publishing via a branch with
# peaceiris/actions-gh-pages sidesteps the flaky deployment API entirely.
#
# After merging, set the repo Pages source to:
#   Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages -> / (root)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy docs/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
