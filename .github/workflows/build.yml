name: Build & Sync

# 当有人修改数据源时，自动重新生成 README / JSON，保证单一数据源与产物一致。
on:
  push:
    paths:
      - "scripts/raw_data.py"
      - "scripts/generate.py"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new abstracts (incremental)
        run: python scripts/fetch_abstracts.py
      # IMPORTANT: use gen_readme.py (not generate.py). generate.py rebuilds
      # data/papers.json from seed.json + data/incremental.json, but the latter
      # is gitignored and ABSENT in CI — so generate.py would silently drop to
      # ~1070 papers and overwrite the real 1897-paper dataset. gen_readme.py
      # only refreshes the data-driven README blocks from the EXISTING
      # data/papers.json, never touching the dataset.
      - name: Regenerate README (dataset-safe)
        run: python scripts/gen_readme.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-regenerate README & data [skip ci]"
            git push
          fi
