name: Build & Sync

# 当有人修改数据源时，自动重新生成 README / JSON，保证单一数据源与产物一致。
on:
  push:
    paths:
      - "scripts/raw_data.py"
      - "scripts/generate.py"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new abstracts (incremental)
        run: python scripts/fetch_abstracts.py
      - name: Regenerate outputs
        run: python scripts/generate.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md data/papers.json docs/papers.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-regenerate README & data [skip ci]"
            git push
          fi
