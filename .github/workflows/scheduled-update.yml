name: Scheduled Update

# Weekly refresh of the atlas: fetch new arXiv papers, re-classify, regenerate
# README + docs, (if the audit passes) auto-commit + push, and publish the site
# to the gh-pages branch so the live site stays in sync.
#
# NOTE: the deploy used to rely on a separate push-triggered "Deploy to GitHub
# Pages" workflow, but a GITHUB_TOKEN push does NOT trigger other workflows, so
# the scheduled push never redeployed the site. We deploy inline here instead.
on:
  schedule:
    - cron: "0 8 * * *"    # every day at 16:00 Beijing time (08:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

# A run can now legitimately take over an hour. Never let a new run race a
# still-running one against the same branch.
concurrency:
  group: scheduled-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Was 45; raised to 180 after the first fix, then to 360 as a safety margin.
    # With data/venue_links.json now committed as a seed cache, the weekly run
    # is incremental (only newly-added preprints are queried), so it normally
    # finishes in minutes. 360 min only matters for a true cold start, e.g. the
    # enrichment cache expired after >7 days with no updates.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The enrichment caches are gitignored (except data/venue_links.json, which
      # is committed as a seed cache so venue resolution is never cold). Without
      # this restore, every run re-fetches abstracts/crossref from scratch.
      - name: Restore enrichment caches
        uses: actions/cache@v4
        with:
          path: |
            data/crossref_cache.json
            data/abstracts.json
            data/code_links.json
            data/found_links.json
          key: atlas-enrich-${{ github.run_id }}
          restore-keys: |
            atlas-enrich-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Best-effort: a transient network failure must not spam notifications.
      # The pipeline commits locally only after its own --strict audit passes.
      # Saturdays run the heavy --full update (DBLP/Crossref harvest + abstract/
      # code-link enrichment); every other day runs the light default refresh.
      - name: Run update pipeline
        continue-on-error: true
        run: |
          DOW=$(date -u +%u)   # 1=Mon ... 6=Sat ... 7=Sun
          if [ "$DOW" = "6" ]; then
            python scripts/update_pipeline.py --full
          else
            python scripts/update_pipeline.py
          fi

      # Guard: the pipeline's audit runs before its commit, but re-verify the
      # dataset here so a regression can never be pushed to main.
      - name: Verify dataset integrity before pushing
        run: python scripts/audit.py --strict

      # Hard stop on silent data loss. A missing input once shrank the dataset
      # from 1897 to 1070 papers with a green build, so compare against the
      # checked-out baseline and refuse to push any net loss.
      - name: Refuse to push a shrinking dataset
        run: |
          git show HEAD:data/papers.json > /tmp/baseline.json 2>/dev/null || exit 0
          python - <<'PY'
          import json, sys

          def count(path):
              with open(path, encoding="utf-8") as f:
                  d = json.load(f)
              return len(d["papers"] if isinstance(d, dict) and "papers" in d else d)

          before, after = count("/tmp/baseline.json"), count("data/papers.json")
          print(f"papers: {before} -> {after}")
          if after < before:
              sys.exit(f"ABORT: dataset shrank by {before - after} paper(s).")
          PY

      # The missing half of the automation: update_pipeline.py only ever ran
      # `git commit`, so every successful run stayed on the throwaway CI
      # runner and main was never updated.
      - name: Push
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          if [ -z "$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline)" ]; then
            echo "No new commits to push."
            exit 0
          fi
          # Someone may have pushed while the (long) pipeline was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Publish the freshly generated docs/ to the gh-pages branch so the live
  # site reflects this run's data. Done inline (not via a separate push-triggered
  # workflow) because a GITHUB_TOKEN push does NOT trigger other workflows, so
  # the scheduled push above would otherwise never redeploy the site.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy docs/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
