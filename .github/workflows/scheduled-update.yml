name: Scheduled Update

# Weekly refresh of the atlas: fetch new arXiv papers, re-classify, regenerate
# README + docs, and (if the audit passes) auto-commit. The push then triggers
# the "Deploy to GitHub Pages" workflow, keeping the live site in sync.
on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # Best-effort: a transient network failure must not spam notifications.
      - name: Run update pipeline
        continue-on-error: true
        run: python scripts/update_pipeline.py
