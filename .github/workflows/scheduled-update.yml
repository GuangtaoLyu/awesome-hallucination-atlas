name: Scheduled Update

# Daily refresh of the atlas: fetch new arXiv papers, re-classify, regenerate
# README + docs, (if the audit passes) auto-commit + push, and publish the site
# to the gh-pages branch so the live site stays in sync. The first Saturday of
# each month additionally runs --enrich to backfill abstracts + code links.
# (The --collect discovery step is intentionally not scheduled — run "full"
#  manually when a new conference proceedings is released.)
#
# NOTE: the deploy used to rely on a separate push-triggered "Deploy to GitHub
# Pages" workflow, but a GITHUB_TOKEN push does NOT trigger other workflows, so
# the scheduled push never redeployed the site. We deploy inline here instead.
on:
  schedule:
    - cron: "0 8 * * *"    # every day at 16:00 Beijing time (08:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode (auto = schedule-based; or pick a heavier one)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - enrich
          - full

permissions:
  contents: write

# A run can now legitimately take over an hour. Never let a new run race a
# still-running one against the same branch.
concurrency:
  group: scheduled-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Was 45; raised to 180 after the first fix, then to 360 as a safety margin.
    # The enrichment caches are now committed (see .gitignore), so every run is
    # incremental and normally finishes in minutes. 360 min remains only as a
    # safety margin for an unusually large first --enrich after a long gap.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The enrichment caches (data/abstracts.json, data/abstracts_extra.json,
      # data/crossref_cache.json, data/code_links.json, data/found_links.json)
      # are now committed to the repo, so every checkout is already warm and the
      # monthly --enrich only fills the newly-added delta (fast, never cold). They
      # are no longer restored from the GitHub Actions cache — a stale cached copy
      # could otherwise override the committed, audit-verified version. See the
      # .gitignore note for the rationale (same as data/venue_links.json /
      # data/incremental.json).

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Best-effort: a transient network failure must not spam notifications.
      # The pipeline commits locally only after its own --strict audit passes.
      # Daily: light default refresh (fetch recent arXiv + regenerate).
      # First Saturday of each month: --enrich (fill abstracts + GitHub code
      #   links for newly-added papers) — the only heavy step worth running
      #   periodically. The --collect discovery channels are intentionally NOT
      #   scheduled: they harvest fixed-year proceedings and have a resume guard
      #   that makes them a no-op after the first run; run "full" manually from
      #   workflow_dispatch when a new conference proceedings drops.
      - name: Run update pipeline
        continue-on-error: true
        env:
          PIPE_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="${PIPE_MODE:-auto}"
          if [ "$MODE" != "auto" ]; then
            echo "manual dispatch: --$MODE"
            python scripts/update_pipeline.py --$MODE
            exit 0
          fi
          DOW=$(date -u +%u)   # 1=Mon ... 6=Sat ... 7=Sun
          DOM=$(date -u +%-d)  # day of month, no leading zero
          if [ "$DOW" = "6" ] && [ "$DOM" -le 7 ]; then
            echo "first Saturday of month: --enrich"
            python scripts/update_pipeline.py --enrich
          else
            python scripts/update_pipeline.py
          fi

      # Guard: the pipeline's audit runs before its commit, but re-verify the
      # dataset here so a regression can never be pushed to main.
      - name: Verify dataset integrity before pushing
        run: python scripts/audit.py --strict

      # Hard stop on silent data loss. A missing input once shrank the dataset
      # from 1897 to 1070 papers with a green build, so compare against the
      # checked-out baseline and refuse to push any net loss.
      - name: Refuse to push a shrinking dataset
        run: |
          git show HEAD:data/papers.json > /tmp/baseline.json 2>/dev/null || exit 0
          python - <<'PY'
          import json, sys

          def count(path):
              with open(path, encoding="utf-8") as f:
                  d = json.load(f)
              return len(d["papers"] if isinstance(d, dict) and "papers" in d else d)

          before, after = count("/tmp/baseline.json"), count("data/papers.json")
          print(f"papers: {before} -> {after}")
          if after < before:
              sys.exit(f"ABORT: dataset shrank by {before - after} paper(s).")
          PY

      # The missing half of the automation: update_pipeline.py only ever ran
      # `git commit`, so every successful run stayed on the throwaway CI
      # runner and main was never updated.
      - name: Push
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          if [ -z "$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline)" ]; then
            echo "No new commits to push."
            exit 0
          fi
          # Someone may have pushed while the (long) pipeline was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Publish the freshly generated docs/ to the gh-pages branch so the live
  # site reflects this run's data. Done inline (not via a separate push-triggered
  # workflow) because a GITHUB_TOKEN push does NOT trigger other workflows, so
  # the scheduled push above would otherwise never redeploy the site.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy docs/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
